# base-inference — the inference layer's own services.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  IMPORTANT: Do NOT run `docker compose up` directly.               │
# │  Use the unified CLI:  ./base-inference deploy local               │
# │  It pre-renders configs, starts services, and validates the stack. │
# └─────────────────────────────────────────────────────────────────────┘
#
# This file is one layer's fragment, not the whole platform. The composed
# deployment is base-platform/compose.base.yaml, which includes this one and
# the other four.
#
# Service groups here:
#   1. ray-head              (Ray Serve LLM + vLLM inference)
#   2. postgres + litellm    (gateway — auth, virtual keys, spend tracking)
#   3. dcgm-exporter         (GPU metrics, emitted under C4)
#   4. open-webui            (chat interface — BELONGS TO THE INTERFACE LAYER,
#                             still here pending its move; see issue #14)
#
# The metrics backend is not here. Prometheus and Grafana belong to the
# platform layer; this layer emits and publishes its scrape targets in
# observability/scrape.d/.
#
# Two ports are reachable from the network: 4000 (LiteLLM API) and 3001
# (Open WebUI). Ray ingress (8000), dashboard (8265), client port (10001)
# and PostgreSQL (5432) stay on the internal Compose network — they are
# NEVER published.
#
# Open WebUI on 3001 is a deliberate exception to the "only 4000" rule, and
# it ships without TLS: put it behind a reverse proxy on any network that is
# not already trusted. See ADR-013.
#
# See docs/ARCHITECTURE.md §5.4 for architecture rationale and §9 for
# the security constraints that justify this port isolation.

services:
  ray-head:
    build:
      context: .
      dockerfile: Dockerfile.ray
    ipc: host
    shm_size: "${RAY_SHM_SIZE:-4gb}"
    volumes:
      # Mounted under /home/ray, not /root: the Ray base image runs as the
      # unprivileged `ray` user (UID 1000), which cannot write to /root. A
      # cache mounted there leaves the download failing on permissions.
      - idia_hf_cache:/home/ray/.cache/huggingface
    environment:
      - HF_HOME=/home/ray/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/home/ray/.cache/huggingface/hub
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      # Newer huggingface_hub releases read HF_TOKEN; older ones only the
      # HUGGING_FACE_HUB_TOKEN above. Both are set so a version bump in the
      # base image does not silently break gated downloads.
      - HF_TOKEN=${HF_TOKEN}
      # Single-model (backward compatible)
      - MODEL_ID=${MODEL_ID}
      - MODEL_SOURCE=${MODEL_SOURCE}
      # Multi-model: set MODELS_COUNT=N and MODEL_1_ID..MODEL_N_SOURCE
      # See docs/ARCHITECTURE.md §5.3 for details
      - MODELS_COUNT=${MODELS_COUNT:-}
      - MODEL_1_ID=${MODEL_1_ID:-}
      - MODEL_1_SOURCE=${MODEL_1_SOURCE:-}
      - MODEL_2_ID=${MODEL_2_ID:-}
      - MODEL_2_SOURCE=${MODEL_2_SOURCE:-}
      - MODEL_3_ID=${MODEL_3_ID:-}
      - MODEL_3_SOURCE=${MODEL_3_SOURCE:-}
      # Per-model engine options (§5.3). Without these the container never sees
      # them, and render_config.py silently falls back to bfloat16 / no
      # quantization / scale-to-zero — an AWQ model would load as if it were not
      # quantized. The unnumbered form is the single-model shorthand.
      - MODEL_DTYPE=${MODEL_DTYPE:-}
      - MODEL_QUANTIZATION=${MODEL_QUANTIZATION:-}
      - MODEL_MIN_REPLICAS=${MODEL_MIN_REPLICAS:-}
      - MODEL_1_DTYPE=${MODEL_1_DTYPE:-}
      - MODEL_1_QUANTIZATION=${MODEL_1_QUANTIZATION:-}
      - MODEL_1_MIN_REPLICAS=${MODEL_1_MIN_REPLICAS:-}
      - MODEL_2_DTYPE=${MODEL_2_DTYPE:-}
      - MODEL_2_QUANTIZATION=${MODEL_2_QUANTIZATION:-}
      - MODEL_2_MIN_REPLICAS=${MODEL_2_MIN_REPLICAS:-}
      - MODEL_3_DTYPE=${MODEL_3_DTYPE:-}
      - MODEL_3_QUANTIZATION=${MODEL_3_QUANTIZATION:-}
      - MODEL_3_MIN_REPLICAS=${MODEL_3_MIN_REPLICAS:-}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-8192}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.9}
      # Read by the VRAM budget check in render_config.py.
      - GPU_COUNT=${GPU_COUNT:-1}
      - GPU_VRAM_GB=${GPU_VRAM_GB:-24.0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/-/routes"]
      interval: 15s
      timeout: 5s
      retries: 10
      # start_period covers cold-start: model download (5-15 min) + Ray Serve init.
      # Do not reduce below 300s — the service will be reported unhealthy during
      # normal first-boot while weights are being downloaded from HuggingFace.
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: "${RAY_MEMORY_LIMIT:-16g}"
        reservations:
          memory: "${RAY_MEMORY_RESERVATION:-8g}"
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    # NO ports: published — 8000 (Ray ingress), 8265 (dashboard), 10001
    # (client) stay on the internal Compose network. See ARCHITECTURE.md §9.3.

  # ── Database ──────────────────────────────────────────────────────────
  # LiteLLM v1.85.0 requires a database for virtual keys, spend tracking and
  # per-key rate limiting — the entire reason the gateway tier exists (§3.1).
  # The Prisma schema shipped in the image hardcodes provider = "postgresql";
  # SQLite is rejected outright. See ADR-012.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # NO ports: published — reachable only on the internal Compose network.

  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.85.0
    depends_on:
      postgres:
        condition: service_healthy
      ray-head:
        condition: service_healthy
    ports:
      - "4000:4000"                  # API — reachable from the network
    volumes:
      # rendered_litellm_config.yaml is generated by `./base-inference deploy local`
      # (scripts/render_config.py --render-all) before `docker compose up`.
      # Do NOT use config.yaml directly — LiteLLM does not perform ${VAR}
      # substitution in its config file; model names would be literal strings.
      - ./rendered_litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      # Credentials for the admin panel at :4000/ui — key management, spend
      # and usage graphs. Distinct from the master key, which is the API
      # credential and must never be handed out for UI access.
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:?UI_PASSWORD must be set in .env}
    healthcheck:
      # Uses python3 urllib — the litellm image does not include curl or wget.
      # 127.0.0.1 instead of localhost avoids IPv6 resolution issues.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["--config=/app/config.yaml"]
    restart: unless-stopped

  # ── Interface ─────────────────────────────────────────────────────────
  # Open WebUI is the screen every user of the institute opens. It talks to
  # LiteLLM as an ordinary OpenAI-compatible backend.
  #
  # The container name is fixed: scripts/colleague.sh reaches into this
  # container's SQLite to create accounts and model access grants (ADR-009),
  # and a renamed container breaks provisioning.
  open-webui:
    # Pinned by digest, and deliberately without a tag: the only tag upstream
    # publishes for this image is ':main', which moves on every push. Since
    # colleague.sh writes into this container's SQLite schema, a silent image
    # swap breaks provisioning halfway (ADR-009).
    #
    # This is the build the provisioning was written and verified against:
    #   built    2026-07-01, upstream commit ecd48e2f718220a6400ecf49eafd4867a38feb10
    #   platforms  linux/amd64 + linux/arm64 (OCI index — safe on the g5 and on a dev Mac)
    #
    # Bumping it is a decision, not an accident: read ADR-009 first, then
    # re-verify the tables colleague.sh touches before changing this line.
    image: ghcr.io/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0
    container_name: ${OWUI_CONTAINER:-idia-webui}
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      # Published to the network, unlike Grafana: this is the interface users
      # reach from their own machines. It is the second and last externally
      # reachable port, and a deliberate exception to the "only 4000" rule in
      # §9.1 — see ADR-013 for why, and for the reverse-proxy caveat.
      - "${OWUI_PORT:-3001}:8080"
    volumes:
      - webui_data:/app/backend/data
    environment:
      - WEBUI_AUTH=true
      # Signup closed: accounts are provisioned by ./base-inference colleague, which is
      # what links the LiteLLM key and the per-model grants. A self-registered
      # account has neither and sees an empty model dropdown.
      - ENABLE_SIGNUP=false
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      # Discovery key — lists available models only. Never a user's key.
      - OPENAI_API_KEY=${OWUI_DISCOVERY_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: "${OWUI_MEMORY_LIMIT:-2g}"
    restart: unless-stopped

  # ── Monitoring ────────────────────────────────────────────────────────
  # The metrics backend is NOT here. Prometheus and Grafana belong to the
  # platform layer (C4), and this layer only emits.
  #
  # What this layer publishes instead:
  #   observability/scrape.d/inference.yml   the targets below, for the backend
  #   observability/dashboards/vllm.json     the engine dashboard
  #
  # Consequence worth knowing before you look for a dashboard: `docker compose
  # up` here gives you a working server with no graphs. To see them, bring up
  # the composed base — base-platform/compose.base.yaml — which runs the
  # backend and mounts what every layer published.
  #
  # This is a real regression against the single-server setup, and it is the
  # price of the split: one Prometheus for five layers instead of five.

  # DCGM Exporter — NVIDIA GPU metrics (utilization, VRAM, temperature).
  # Uses a profile so it only starts on native Linux with NVIDIA drivers:
  #   docker compose --profile gpu up
  # On macOS (no GPU passthrough), omit `--profile gpu` — this service is skipped.
  # The ./base-inference script auto-detects nvidia-smi presence and adds --profile gpu.
  # See docs/ARCHITECTURE.md §5.4 for details.
  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.3.7-3.5.0-ubuntu22.04
    profiles: ["gpu"]
    deploy:
      resources:
        limits:
          memory: "256m"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  idia_hf_cache:
    name: idia_hf_cache
  # Virtual keys, spend history, budgets. Losing this volume means every user
  # loses their key and their accumulated spend record.
  postgres_data:
    name: idia_postgres_data
  # Open WebUI accounts, conversations and model access grants.
  webui_data:
    name: idia_webui_data
